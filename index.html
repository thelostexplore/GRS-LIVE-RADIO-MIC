<style>
  :root{ --m-950:#1e0502; --m-900:#2e0804; --m-800:#430c05; --m-700:#621206; --gold:#dcae55; --gold-hi:#f6d88c; --gold-lo:#a87a2c;
    --ivory:#f8eedc; --muted:rgba(248,238,220,.6); --faint:rgba(248,238,220,.12); --line:rgba(220,174,85,.25); --ok:#5fd38d; --bad:#ff7a6e; --rec:#ff4b3e;
    --serif:'Cormorant Garamond',Georgia,serif; --sans:'Manrope',system-ui,sans-serif; }
  *{box-sizing:border-box; margin:0; padding:0}
  html{background:var(--m-950)}
  body{min-height:100vh; font-family:var(--sans); color:var(--ivory); display:flex; align-items:center; justify-content:center; padding:20px;
    background:radial-gradient(120% 70% at 50% -10%, rgba(220,174,85,.14), transparent 60%), radial-gradient(130% 100% at 50% 0%, var(--m-700), var(--m-900) 55%, var(--m-950)); background-attachment:fixed;
    -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none}
  button,input{font:inherit; color:inherit}
  .card{width:100%; max-width:420px; text-align:center; padding:28px 24px 24px; border-radius:26px; border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(67,12,5,.78), rgba(30,5,2,.9)); box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .emb{width:62px; height:62px; border-radius:50%; margin:0 auto 10px; display:block}
  h1{font-family:var(--serif); font-weight:600; font-size:30px; color:var(--gold-hi); line-height:1.1}
  .sub{font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-top:4px}
  .in{width:100%; height:48px; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:rgba(0,0,0,.28); outline:none; margin-top:8px; text-align:left}
  .in:focus{border-color:var(--gold-hi)}
  label{display:block; text-align:left; font-size:12px; color:var(--muted); margin-top:16px}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; height:50px; margin-top:18px; border:0; border-radius:99px; cursor:pointer;
    font-weight:700; color:var(--m-950); background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,#b98b3c)}
  .btn.ghost{background:transparent; color:var(--gold-hi); border:1px solid var(--line)}
  .btn:disabled{opacity:.5}
  .err{color:var(--bad); font-size:13px; min-height:18px; margin-top:12px}
  .mic{width:150px; height:150px; border-radius:50%; border:0; margin:26px auto 14px; display:grid; place-items:center; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, var(--gold-hi), var(--gold) 55%, #a87a2c); color:var(--m-950);
    box-shadow:0 18px 40px rgba(220,174,85,.3), inset 0 2px 0 rgba(255,255,255,.5); transition:transform .15s}
  .mic:active{transform:scale(.96)} .mic svg{width:60px; height:60px}
  .mic.rec{background:radial-gradient(circle at 35% 30%, #ff8a7f, var(--rec) 60%, #c22a1f); color:#fff; animation:pulse 1.3s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,75,62,.55)}70%{box-shadow:0 0 0 26px rgba(255,75,62,0)}100%{box-shadow:0 0 0 0 rgba(255,75,62,0)}}
  .state{font-size:15px; font-weight:600; min-height:22px}
  .time{font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:4px; min-height:42px}
  .meter{height:8px; border-radius:8px; background:var(--faint); overflow:hidden; margin:10px 20px 4px} .meter i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--ok),var(--gold-hi),var(--rec)); transition:width .08s}
  .to{font-size:12px; color:var(--muted); margin-top:18px; text-align:left}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
  .chip{padding:7px 12px; border-radius:99px; border:1px solid var(--line); background:none; font-size:12.5px; color:var(--muted); cursor:pointer}
  .chip.on{background:var(--gold); color:var(--m-950); border-color:var(--gold); font-weight:700}
  .row{display:flex; gap:10px} .row .btn{margin-top:14px}
  .msg{font-size:13.5px; margin-top:12px; min-height:20px}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  .foot{margin-top:18px; font-size:11.5px; color:var(--muted)} .foot a{color:var(--gold); cursor:pointer; text-decoration:underline}
  .hidden{display:none}
</style>
</head>

  <h1>GRS Mic</h1>
  <div class="sub">Live announcements</div>

  <!-- first-time setup / login -->
  <section id="loginView" class="hidden">
    <label>GRS Live link (the web app address ending in /exec)
      <input class="in" id="apiInput" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false">
    </label>
    <label>Admin PIN
      <input class="in" id="pinInput" type="password" autocomplete="current-password" autocapitalize="characters">
    </label>
    <button class="btn" id="loginBtn">Log in</button>
    <div class="err" id="loginErr"></div>
  </section>

  <!-- talk -->
  <section id="talkView" class="hidden">
    <button class="mic" id="micBtn" aria-label="Talk">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
    <div class="state" id="state">Tap the mic and speak</div>
    <div class="time" id="time"></div>
    <div class="meter"><i id="meter"></i></div>
    <div class="row hidden" id="recBtns"><button class="btn ghost" id="cancelBtn">Cancel</button><button class="btn" id="sendBtn">Send</button></div>
    <div class="msg" id="msg"></div>
    <div class="to">Send to</div>
    <div class="chips" id="chips"></div>
    <div class="foot">Showrooms hear it in about 10 seconds · <a id="logoutLink">Log out</a></div>
  </section>
</main>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var store = { get:function(k){ try{return localStorage.getItem(k);}catch(e){return null;} }, set:function(k,v){ try{localStorage.setItem(k,v);}catch(e){} }, del:function(k){ try{localStorage.removeItem(k);}catch(e){} } };
  var API = store.get('grsmic_api') || '', token = store.get('grsmic_token') || '';
  var rooms = [], targets = ['ALL'];

  function api(body){
    return fetch(API, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' })
      .catch(function(){ throw new Error('NO_CONNECTION'); })
      .then(function(r){ return r.text(); })
      .then(function(t){
        var j; try { j = JSON.parse(t); } catch (e) { throw new Error(/doPost/i.test(t) ? 'NOT_DEPLOYED' : /accounts\.google|sign in/i.test(t) ? 'NEEDS_ANYONE' : 'NOT_DEPLOYED'); }
        if (!j.ok) throw new Error(j.error); return j.result;
      });
  }
  function why(e){
    var m = String(e && e.message || e);
    if (/BAD_PIN/.test(m)) return 'Wrong PIN';
    if (/NOT_DEPLOYED/.test(m)) return 'GRS Live answered, but the mic feature is not switched on yet. In Apps Script: Deploy → Manage deployments → ✏️ Edit → Version: New version → Deploy. Then try again.';
    if (/NEEDS_ANYONE/.test(m)) return 'GRS Live asked for a Google sign-in. The deployment must be set to "Who has access: Anyone".';
    if (/NO_CONNECTION/.test(m)) return location.protocol === 'file:' && /iPhone|iPad|Android/i.test(navigator.userAgent)
      ? 'Phones cannot use this page as a file. Open it from a web link instead (ask for the GitHub Pages setup).'
      : 'Could not connect — check the internet and the link.';
    return 'Error: ' + m;
  }
  function needLogin(msg){ $('talkView').classList.add('hidden'); $('loginView').classList.remove('hidden'); $('apiInput').value = API; $('loginErr').textContent = msg || ''; }
  function handle(e){
    var m = String(e && e.message || e);
    if (/ADMIN_LOGIN/.test(m)) { token = ''; store.del('grsmic_token'); needLogin('Please log in again'); return true; }
    return false;
  }

  // ── login ──
  $('loginBtn').addEventListener('click', function(){
    var url = $('apiInput').value.trim(), pin = $('pinInput').value.trim();
    if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)) { $('loginErr').textContent = 'Paste the GRS Live web app link (it ends in /exec)'; return; }
    if (!pin) { $('loginErr').textContent = 'Enter the admin PIN'; return; }
    API = url.replace(/\?.*$/, ''); $('loginErr').textContent = 'Checking…'; $('loginBtn').disabled = true;
    api({ action: 'login', pin: pin }).then(function(r){
      token = r.token; store.set('grsmic_api', API); store.set('grsmic_token', token); $('pinInput').value = '';
      showTalk();
    }).catch(function(e){
      $('loginErr').textContent = why(e);
    }).then(function(){ $('loginBtn').disabled = false; });
  });
  $('logoutLink').addEventListener('click', function(){ token = ''; store.del('grsmic_token'); needLogin(''); });

  function showTalk(){
    $('loginView').classList.add('hidden'); $('talkView').classList.remove('hidden');
    api({ action: 'rooms', token: token }).then(function(r){ rooms = r; renderChips(); }).catch(function(e){ if (!handle(e)) $('msg').innerHTML = '<span class="bad">Could not load showrooms</span>'; });
    renderChips();
  }
  function renderChips(){
    $('chips').innerHTML = '<button class="chip' + (targets[0] === 'ALL' ? ' on' : '') + '" data-t="ALL">All showrooms</button>' +
      rooms.map(function(r){ return '<button class="chip' + (targets.indexOf(r.pin) > -1 ? ' on' : '') + '" data-t="' + r.pin + '">' + r.name.replace(/</g,'&lt;') + '</button>'; }).join('');
    Array.prototype.forEach.call($('chips').children, function(b){
      b.addEventListener('click', function(){
        var t = b.dataset.t;
        if (t === 'ALL') targets = ['ALL'];
        else { targets = targets.filter(function(x){ return x !== 'ALL'; }); var i = targets.indexOf(t); if (i > -1) targets.splice(i, 1); else targets.push(t); if (!targets.length) targets = ['ALL']; }
        renderChips();
      });
    });
  }

  // ── recording ──
  var rec = null, stream = null, chunks = [], started = 0, timer = null, mime = '', ctx = null, send = false;
  function setState(t){ $('state').textContent = t; }
  function start(){
    $('msg').textContent = '';
    if (!navigator.mediaDevices || !window.MediaRecorder) { $('msg').innerHTML = '<span class="bad">This browser cannot record. Please use Google Chrome.</span>'; return; }
    setState('Allow the microphone if asked…');
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }).then(function(s){
      stream = s;
      mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].filter(function(m){ return MediaRecorder.isTypeSupported(m); })[0] || '';
      rec = mime ? new MediaRecorder(s, { mimeType: mime, audioBitsPerSecond: 64000 }) : new MediaRecorder(s);
      mime = rec.mimeType || mime || 'audio/webm';
      chunks = [];
      rec.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
      rec.onstop = stopped;
      rec.start(250); started = Date.now();
      $('micBtn').classList.add('rec'); $('recBtns').classList.remove('hidden');
      setState('Recording… tap the mic or Send when done');
      timer = setInterval(function(){ var x = Math.floor((Date.now() - started) / 1000); $('time').textContent = Math.floor(x/60) + ':' + ('0' + x%60).slice(-2); if (x >= 120) finish(true); }, 250);
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        var an = ctx.createAnalyser(); an.fftSize = 512; ctx.createMediaStreamSource(s).connect(an);
        var buf = new Uint8Array(an.fftSize);
        (function tick(){ if (!rec) return; an.getByteTimeDomainData(buf); var p = 0; for (var i=0;i<buf.length;i++) p = Math.max(p, Math.abs(buf[i]-128)); $('meter').style.width = Math.min(100, p/128*180) + '%'; requestAnimationFrame(tick); })();
      } catch(e){}
    }).catch(function(){
      setState('Tap the mic and speak');
      $('msg').innerHTML = '<span class="bad">Microphone blocked. Click the 🔒 / ⓘ icon next to the address → allow Microphone → reload.</span>';
    });
  }
  function finish(doSend){
    send = doSend; clearInterval(timer);
    $('micBtn').classList.remove('rec'); $('recBtns').classList.add('hidden');
    if (rec && rec.state !== 'inactive') rec.stop();
  }
  function stopped(){
    var secs = (Date.now() - started) / 1000;
    if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
    try { ctx && ctx.close(); } catch(e){}
    rec = null; stream = null; $('meter').style.width = '0'; $('time').textContent = '';
    if (!send) { setState('Tap the mic and speak'); return; }
    if (secs < 1) { setState('Tap the mic and speak'); $('msg').textContent = 'Too short — speak a little longer'; return; }
    setState('Sending…');
    var blob = new Blob(chunks, { type: mime });
    var r = new FileReader();
    r.onload = function(){
      api({ action: 'announce', token: token, b64: String(r.result).split(',')[1], mime: mime.split(';')[0], targets: targets, seconds: secs }).then(function(a){
        setState('Tap the mic and speak'); $('msg').innerHTML = '<span class="ok">✓ Sent to ' + a.names + ' · plays in about 10 seconds</span>';
      }).catch(function(e){ setState('Tap the mic and speak'); if (!handle(e)) $('msg').innerHTML = '<span class="bad">Sending failed — check the internet and try again</span>'; });
    };
    r.readAsDataURL(blob);
  }
  $('micBtn').addEventListener('click', function(){ rec ? finish(true) : start(); });
  $('sendBtn').addEventListener('click', function(){ finish(true); });
  $('cancelBtn').addEventListener('click', function(){ finish(false); });

  if (API && token) showTalk(); else needLogin('');
})();
</script>
</body>
</html>
